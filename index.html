<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #181b22;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #f59e0b;
      --border: #262a34;
      --pill-bg: #222630;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 640px;
      margin: 0 auto;
      gap: 12px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .lang-switch {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      flex-shrink: 0;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #000;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: rgba(15, 17, 21, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
      max-width: 640px;
      margin: 0 auto;
    }

    nav::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }

    .category-section {
      margin-bottom: 28px;
    }

    .category-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--accent);
    }

    .menu-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .item-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background-color: #12141a;
      border-bottom: 1px solid var(--border);
    }

    .item-body {
      padding: 16px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .item-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .tag {
      font-size: 0.72rem;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      padding: 3px 9px;
      border-radius: 6px;
      font-weight: 600;
    }

    .item-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .ingredients-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .ingredients-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ingredient-pill {
      background: var(--pill-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .error-msg {
      text-align: center;
      color: #ef4444;
      padding: 32px 16px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="restaurant-name">Loading...</h1>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="pl">PL</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </header>

  <nav id="category-nav"></nav>

  <main id="menu-container"></main>

  <script>
    let menuData = null;
    // Tarayıcı dili Polonyaca ise PL, değilse EN varsayılan olarak seçilir
    let currentLang = navigator.language.toLowerCase().startsWith('pl') ? 'pl' : 'en';
    let activeCategory = 'all';

    async function initMenu() {
      const container = document.getElementById('menu-container');

      try {
        const response = await fetch(`./menu.json?v=${Date.now()}`);
        if (!response.ok) throw new Error('JSON fetch failed');

        menuData = await response.json();
        setupLanguageButtons();
        renderMenu();
      } catch (error) {
        container.innerHTML = `
          <div class="error-msg">
            Failed to load menu data. Please use a local server or GitHub Pages.
          </div>
        `;
        console.error(error);
      }
    }

    function setupLanguageButtons() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
        btn.addEventListener('click', () => {
          currentLang = btn.dataset.lang;
          document.documentElement.lang = currentLang;
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderMenu();
        });
      });
    }

    function renderMenu() {
      if (!menuData) return;

      const container = document.getElementById('menu-container');
      const nav = document.getElementById('category-nav');
      const titleEl = document.getElementById('restaurant-name');
      const uiText = menuData.ui[currentLang];

      titleEl.textContent = menuData.restaurantName[currentLang];
      document.title = `${menuData.restaurantName[currentLang]} - Menu`;

      nav.innerHTML = '';
      container.innerHTML = '';

      nav.appendChild(createTabButton(uiText.allTab, 'all', activeCategory === 'all'));

      menuData.categories.forEach(category => {
        nav.appendChild(createTabButton(category.title[currentLang], category.id, activeCategory === category.id));

        const section = document.createElement('section');
        section.className = 'category-section';
        section.dataset.category = category.id;
        section.style.display = (activeCategory === 'all' || activeCategory === category.id) ? 'block' : 'none';

        const catTitle = document.createElement('h2');
        catTitle.className = 'category-title';
        catTitle.textContent = category.title[currentLang];
        section.appendChild(catTitle);

        category.items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'menu-item';

          const tagText = item.tag ? item.tag[currentLang] : '';
          const tagHTML = tagText ? `<span class="tag">${tagText}</span>` : '';

          const imageHTML = item.image
            ? `<img class="item-image" src="${item.image}" alt="${item.name[currentLang]}" loading="lazy" onerror="this.style.display='none'" />`
            : '';

          const ingList = item.ingredients ? item.ingredients[currentLang] : [];
          const ingredientsHTML = (ingList && ingList.length > 0)
            ? `
              <div class="ingredients-title">${uiText.ingredientsTitle}</div>
              <div class="ingredients-list">
                ${ingList.map(ing => `<span class="ingredient-pill">${ing}</span>`).join('')}
              </div>
            `
            : '';

          card.innerHTML = `
            ${imageHTML}
            <div class="item-body">
              <div class="item-header">
                <h3>${item.name[currentLang]}</h3>
                ${tagHTML}
              </div>
              <p class="item-desc">${item.description[currentLang] || ''}</p>
              ${ingredientsHTML}
            </div>
          `;
          section.appendChild(card);
        });

        container.appendChild(section);
      });
    }

    function createTabButton(label, targetId, isActive) {
      const btn = document.createElement('button');
      btn.className = `tab-btn ${isActive ? 'active' : ''}`;
      btn.textContent = label;

      btn.addEventListener('click', () => {
        activeCategory = targetId;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.category-section').forEach(sec => {
          if (targetId === 'all' || sec.dataset.category === targetId) {
            sec.style.display = 'block';
          } else {
            sec.style.display = 'none';
          }
        });
      });

      return btn;
    }

    document.addEventListener('DOMContentLoaded', initMenu);
  </script>
</body>
</html>
